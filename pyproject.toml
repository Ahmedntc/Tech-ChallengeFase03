[project]
name = "triagem-laudos-mlet"
version = "0.1.0"
description = "Sistema de triagem automatica de laudos medicos (classificacao de urgencia) - Tech Challenge Fase 3 MLET"
authors = [{ name = "Ahmed" }]
readme = "README.md"
requires-python = ">=3.10,<3.13"

dependencies = [
  "fastapi (>=0.115,<0.116)",
  "uvicorn[standard] (>=0.32,<0.33)",
  "scikit-learn (>=1.5,<1.6)",
  "pandas (>=2.2,<2.3)",
  "numpy (>=1.26,<2.0)",
  "joblib (>=1.4,<1.5)",
  "prometheus-client (>=0.21,<0.22)",
  "onnxruntime (>=1.19,<1.20)",
  "skl2onnx (>=1.17,<1.18)",
  "pydantic (>=2.9,<3.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
httpx = "^0.27"
ruff = "^0.7"
pytest-cov = "^5.0"

[tool.ruff]
line-length = 100
target-version = "py311"
# Além dos excludes padrão do ruff (.venv, .git, __pycache__ etc.), o
# ".venv-airflow" (venv separado do Airflow, ver airflow/requirements.txt)
# não bate com o nome padrão ".venv" e precisa ser listado explicitamente.
extend-exclude = [".venv-airflow"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"