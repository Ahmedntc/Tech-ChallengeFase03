name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Poetry
        run: pipx install poetry==2.4.1

      - name: Cache do Poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Instalar dependências
        run: poetry install --no-root

      - name: Rodar ruff
        run: poetry run ruff check .

  test:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Poetry
        run: pipx install poetry==2.4.1

      - name: Cache do Poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Instalar dependências
        run: poetry install --no-root

      - name: Rodar testes
        run: poetry run pytest -v

  build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Treinar modelo baseline (necessário para o build da imagem)
        run: |
          pipx install poetry==2.4.1
          poetry install --no-root
          poetry run python -m training.train

      - name: Build da imagem Docker
        run: docker build -t triagem-laudos-api:${{ github.sha }} .